# SASL PLAIN for Kafka's command-line tools against the local stack (the healthcheck uses it), for
# this local stack only. From the host: --bootstrap-server localhost:9094 --command-config this file.
security.protocol=SASL_PLAINTEXT
sasl.mechanism=PLAIN
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="tbp-dev" password="tbp-dev-dev";
