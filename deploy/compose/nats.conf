# NATS for the local stack (ADR-0021): the monitoring endpoint the healthcheck reads, and one user
# per caller, for this local stack only. JetStream stays off: core request and reply is all the
# RPC transport uses.
http_port: 8222

authorization {
  users = [
    # The API: serves the RPC methods.
    { user: tbp-api, password: tbp-api-dev }
    # The platform's own services calling NATS RPC.
    { user: tbp-service, password: tbp-service-dev }
  ]
}
