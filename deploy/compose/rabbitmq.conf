# Loaded after the image's 10-defaults.conf. The definitions declare the exchange the TigerBeetle
# CDC job publishes to and the queue the Kafka relay reads (ADR-0022), so the job never publishes
# to a missing exchange. Because definitions are imported, they also hold the guest user, whose
# password is guest (hash from `rabbitmqctl hash_password guest`).
load_definitions = /etc/rabbitmq/definitions.json
