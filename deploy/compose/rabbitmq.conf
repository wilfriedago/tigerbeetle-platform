# Loaded after the image's 10-defaults.conf. The definitions declare the exchange the TigerBeetle
# CDC job publishes to and the queue the Kafka relay reads (ADR-0022), so the job never publishes
# to a missing exchange. Because definitions are imported, they also hold the users, one per
# caller, for this local stack only:
#   tbp-admin / tbp-admin-dev       the management UI
#   tbp-api / tbp-api-dev           the API: serves tbp.rpc.v1, reads tbp.ledger-events.relay
#   tbp-cdc / tbp-cdc-dev           the TigerBeetle CDC job: publishes to tbp.cdc
#   tbp-service / tbp-service-dev   the platform's own services calling AMQP RPC: publishes to tbp.rpc
# Hashes from `rabbitmqctl hash_password <password>`. The image's guest user is not created.
load_definitions = /etc/rabbitmq/definitions.json
