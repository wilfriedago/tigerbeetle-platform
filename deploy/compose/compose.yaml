# Local development stack: TigerBeetle, Postgres, the API and the console. The brokers profile
# (`just compose-up-brokers`) adds RabbitMQ, NATS, Kafka and the TigerBeetle CDC job, and turns
# the broker RPC transports and the Kafka relay on.
# Run from the repository root with `just compose-up` (docker compose --project-directory . ...),
# so variables come from the root .env (see .env.example) and build contexts resolve correctly.
#
# Image tags here are the pinned versions of the stack. scripts/check-versions.sh and the Go
# integration tests read them from this file, so bump them here only.
name: tigerbeetle-platform

services:
  # One-time format of the TigerBeetle data file, skipped when it already exists. The image's
  # entrypoint is the tigerbeetle binary, so a shell is needed for the test.
  tigerbeetle-format:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.17.9
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        test -f /data/0_0.tigerbeetle ||
        exec /tigerbeetle format --cluster=0 --replica=0 --replica-count=1 /data/0_0.tigerbeetle
    # Docker 25+ blocks io_uring by default; TigerBeetle needs it (docs: operating/deploying/docker).
    security_opt:
      - seccomp=unconfined
    # Lets the replica lock its memory on Docker for Mac.
    cap_add:
      - IPC_LOCK
    volumes:
      - tigerbeetle-data:/data

  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.17.9
    # A fixed address, because the CDC job accepts IP addresses only (ADR-0022).
    networks:
      default:
        ipv4_address: 172.30.231.10
    # --cache-grid keeps memory small in development without --development, which would also
    # shrink the batch size and change request limits compared with production.
    command: ['start', '--addresses=0.0.0.0:3000', '--cache-grid=256MiB', '/data/0_0.tigerbeetle']
    security_opt:
      - seccomp=unconfined
    cap_add:
      - IPC_LOCK
    volumes:
      - tigerbeetle-data:/data
    ports:
      - '${TIGERBEETLE_PORT:-13000}:3000'
    depends_on:
      tigerbeetle-format:
        condition: service_completed_successfully
    healthcheck:
      # The image ships busybox, so nc is available; the replica accepts TCP once it is up.
      test: ['CMD', 'nc', '-z', '127.0.0.1', '3000']
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledger}
      POSTGRES_DB: ${POSTGRES_DB:-ledger}
    volumes:
      # Postgres 18 images moved the volume from /var/lib/postgresql/data to /var/lib/postgresql.
      # Mounting the old path would leave the cluster outside the volume and lose it on recreate.
      - postgres-data:/var/lib/postgresql
    ports:
      - '${POSTGRES_PORT:-15432}:5432'
    healthcheck:
      # -h 127.0.0.1 forces TCP: during initialisation the server only listens on the unix socket,
      # and a socket check would report healthy too early.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-ledger} -d ${POSTGRES_DB:-ledger}']
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      API_ADDR: ':8080'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POSTGRES_URL: postgres://${POSTGRES_USER:-ledger}:${POSTGRES_PASSWORD:-ledger}@postgres:5432/${POSTGRES_DB:-ledger}?sslmode=disable
      TIGERBEETLE_CLUSTER_ID: '0'
      TIGERBEETLE_ADDRESSES: tigerbeetle:3000
      MIGRATE_ON_START: 'true'
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      READINESS_TIMEOUT: ${READINESS_TIMEOUT:-2s}
      TIGERBEETLE_TIMEOUT: ${TIGERBEETLE_TIMEOUT:-5s}
      RECONCILER_GRACE_PERIOD: ${RECONCILER_GRACE_PERIOD:-30s}
      RECONCILER_INTERVAL: ${RECONCILER_INTERVAL:-10s}
      # gRPC, the broker RPC transports and the Kafka relay stay off unless asked for:
      # development only until authentication is decided (ADR-0021, ADR-0022).
      GRPC_ENABLED: ${GRPC_ENABLED:-false}
      GRPC_ADDR: ':9090'
      AMQP_RPC_ENABLED: ${AMQP_RPC_ENABLED:-false}
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      NATS_RPC_ENABLED: ${NATS_RPC_ENABLED:-false}
      NATS_URL: nats://nats:4222
      KAFKA_EVENTS_ENABLED: ${KAFKA_EVENTS_ENABLED:-false}
      KAFKA_BROKERS: kafka:9092
      CDC_AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      # Tokens name the issuer browsers see; the API reads discovery and keys inside the network
      # (ADR-0026). Keycloak's backchannel URLs follow the address it is called on.
      AUTH_ISSUER_URL: http://localhost:${KEYCLOAK_PORT:-18080}/realms/tbp
      AUTH_DISCOVERY_URL: http://keycloak:8080/realms/tbp
      AUTH_AUDIENCE: tbp-api
      # The console's sign-in (ADR-0030). The secret and the session key are for this local stack
      # only; generate your own anywhere else (openssl rand -base64 32).
      AUTH_CLIENT_ID: tbp-console
      AUTH_CLIENT_SECRET: tbp-console-dev-secret
      AUTH_REDIRECT_URL: http://localhost:${CONSOLE_PORT:-5173}/api/auth/callback
      AUTH_CONSOLE_ORIGIN: http://localhost:${CONSOLE_PORT:-5173}
      AUTH_SESSION_KEY: ${AUTH_SESSION_KEY:-ZGV2LW9ubHktc2Vzc2lvbi1rZXktMzItYnl0ZXMtISE=}
      AUTH_COOKIE_SECURE: 'false'
      # The service account for Keycloak's admin API: organizations, members, invitations (ADR-0027).
      AUTH_ADMIN_CLIENT_ID: tbp-admin
      AUTH_ADMIN_CLIENT_SECRET: tbp-admin-dev-secret
    ports:
      - '${API_PORT:-8080}:8080'
      - '${GRPC_PORT:-9090}:9090'
    # The TigerBeetle Go client embeds the same io_uring-based I/O as the server, so the api
    # container needs the seccomp override too; without it the client fails to initialise.
    security_opt:
      - seccomp=unconfined
    depends_on:
      postgres:
        condition: service_healthy
      tigerbeetle:
        condition: service_healthy
      # The API reads Keycloak's discovery document at startup.
      keycloak:
        condition: service_healthy
      # Only with the brokers profile; without it these are skipped.
      rabbitmq:
        condition: service_healthy
        required: false
      nats:
        condition: service_healthy
        required: false
      kafka:
        condition: service_healthy
        required: false
    healthcheck:
      # The runtime image has no shell or curl; the binary probes itself.
      test: ['CMD', '/app/api', '-probe', 'http://127.0.0.1:8080/readyz']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Pre-alpha seed, until staff create organizations and invite members through the API
  # (docs/plans/auth/plan.md, phase 5): the platform's copies of the realm's organizations
  # ("default" comes with migration 00009) and the organization roles of the dev users, whose
  # Keycloak IDs are fixed in keycloak/realm.json. Runs once the API has migrated the database.
  organizations-seed:
    image: postgres:18.6-trixie
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-ledger}
      ISSUER: http://localhost:${KEYCLOAK_PORT:-18080}/realms/tbp
    command:
      - sh
      - -c
      - >-
        psql --host=postgres --username=${POSTGRES_USER:-ledger} --dbname=${POSTGRES_DB:-ledger}
        --set=ON_ERROR_STOP=1 --set=issuer="$$ISSUER" --file=/seed/dev-seed.sql
    volumes:
      - ./deploy/compose/dev-seed.sql:/seed/dev-seed.sql:ro
    depends_on:
      api:
        condition: service_healthy
    restart: 'no'

  # Keycloak keeps its data in its own database on the same Postgres server (ADR-0026).
  keycloak-db:
    image: postgres:18.6-trixie
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-ledger}
    entrypoint: ['sh', '-c']
    command:
      - >-
        psql -h postgres -U ${POSTGRES_USER:-ledger} -d ${POSTGRES_DB:-ledger} -tAc
        "SELECT 1 FROM pg_database WHERE datname = 'keycloak'" | grep -q 1 ||
        psql -h postgres -U ${POSTGRES_USER:-ledger} -d ${POSTGRES_DB:-ledger} -c 'CREATE DATABASE keycloak'
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # The identity provider (ADR-0026): realm tbp, imported at start from keycloak/realm.json and
  # skipped when it exists. Admin console at http://localhost:18080 (admin / admin). Every dev
  # user's password is "password".
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-ledger}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-ledger}
      # Tokens and login pages name the address browsers use; calls from inside the network keep
      # their own address for the token and key endpoints.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-18080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HEALTH_ENABLED: 'true'
    volumes:
      - ./deploy/compose/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - '${KEYCLOAK_PORT:-18080}:8080'
    healthcheck:
      # The image has no curl; bash opens the management port's readiness endpoint itself.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    depends_on:
      keycloak-db:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  # Catches every email Keycloak sends, such as invitations; read them at http://localhost:18025.
  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    ports:
      - '${MAILPIT_PORT:-18025}:8025'

  rabbitmq:
    image: rabbitmq:4.4.0-management@sha256:c200fd496482cda18c412be4e6f244830e1e75949b8cf5f0e887cea9ea456109
    profiles: [brokers]
    networks:
      default:
        ipv4_address: 172.30.231.11
    volumes:
      - ./deploy/compose/rabbitmq.conf:/etc/rabbitmq/conf.d/20-tbp.conf:ro
      - ./deploy/compose/rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      # The management UI, guest/guest.
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  nats:
    image: nats:2.15.1-alpine@sha256:7ae34c25dfd6fe2e01c6483eabef20d796690fdcac6c4d94ca780a6cf9877fde
    profiles: [brokers]
    # -m serves the monitoring endpoint the healthcheck reads. JetStream stays off: core request
    # and reply is all the RPC transport uses.
    command: ['-m', '8222']
    ports:
      - '${NATS_PORT:-4222}:4222'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8222/healthz']
      interval: 2s
      timeout: 2s
      retries: 15

  # TigerBeetle change data capture (ADR-0022): the amqp subcommand of the server's own image, so it
  # is never newer than the cluster. It reads committed transfers in timestamp order and publishes
  # them to the tbp.cdc exchange; its progress lives in RabbitMQ, so a restart resumes. It takes IP
  # addresses only, hence the fixed ones above.
  tigerbeetle-cdc:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.17.9
    profiles: [brokers]
    command:
      - amqp
      - --cluster=0
      - --addresses=172.30.231.10:3000
      - --host=172.30.231.11:5672
      - --vhost=/
      - --user=guest
      - --password=guest
      - --publish-exchange=tbp.cdc
    # io_uring, as for the server.
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped
    depends_on:
      tigerbeetle:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  kafka:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    profiles: [brokers]
    environment:
      # One KRaft node that is both broker and controller. Containers reach it as kafka:9092, the
      # host as localhost:${KAFKA_PORT}.
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_NUM_PARTITIONS: '3'
    ports:
      - '${KAFKA_PORT:-9094}:9094'
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1']
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  console:
    build:
      context: .
      dockerfile: deploy/compose/console.Dockerfile
    environment:
      # The Vite dev server proxies /api to the API inside the compose network, so the browser
      # only ever talks to the console origin and no CORS configuration is needed.
      API_PROXY_TARGET: http://api:8080
    ports:
      - '${CONSOLE_PORT:-5173}:5173'
    volumes:
      # Live reload for the console, the client and the schema without rebuilding the image.
      - ./apps/console/src:/workspace/apps/console/src
      - ./packages/api-client/src:/workspace/packages/api-client/src
      - ./packages/graphql:/workspace/packages/graphql
    depends_on:
      api:
        condition: service_started

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.231.0/24

volumes:
  tigerbeetle-data:
  postgres-data:
