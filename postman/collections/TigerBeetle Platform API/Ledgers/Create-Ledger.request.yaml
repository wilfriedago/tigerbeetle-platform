$kind: http-request
name: Create Ledger
order: 3000
method: POST
url: '{{baseUrl}}/v1/ledgers/{{ledger}}'
pathVariables:
  - key: ledger
    value: '{{ledger}}'
    description: The ledger name (permanent, used in every API path)
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "metadata": {
        "env": "local",
        "owner": "platform-team"
      }
    }
