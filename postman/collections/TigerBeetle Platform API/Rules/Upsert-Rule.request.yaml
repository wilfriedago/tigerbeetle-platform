$kind: http-request
name: Upsert Rule
order: 3000
method: PUT
url: '{{baseUrl}}/v1/ledgers/{{ledger}}/rules/{{rulePattern}}'
pathVariables:
  - key: ledger
    value: '{{ledger}}'
  - key: pattern
    value: '{{rulePattern}}'
    description: 'Address glob pattern, e.g. users:*'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "limit": "debits_must_not_exceed_credits",
      "code": 1,
      "history": false
    }
