$kind: http-request
name: Match Rules
order: 2000
method: GET
url: '{{baseUrl}}/v1/ledgers/{{ledger}}/rules/match'
pathVariables:
  - key: ledger
    value: '{{ledger}}'
queryParams:
  - key: address
    value: '{{address}}'
    description: 'The account address to match rules against'
    disabled: true
