  /v1/ledgers/{ledger}/transactions:
    get:
      description: |
        Committed transactions, newest first, with their postings read from TigerBeetle. Declined
        writes are not transactions in TigerBeetle; they are listed under write requests. There is
        no sort or filter by amount (ADR-0004).
      operationId: listTransactions
      parameters:
        - description: The opaque `next` cursor of the previous page.
          in: query
          name: cursor
          schema:
            maxLength: 512
            type: string
        - description: The alias of the organization the call acts for. A person sends it on every call about a ledger and must be a member of the organization; an organization that is not one of theirs answers 404. API keys and machine clients belong to one organization and need not send it.
          in: header
          name: X-Organization
          schema:
            maxLength: 63
            type: string
        - description: Correlates the request with the service logs. Kept when it is 1 to 128 printable ASCII characters without spaces, replaced by a new ID otherwise, and returned in the X-Request-Id response header.
          in: header
          name: X-Request-Id
          schema:
            maxLength: 128
            type: string
        - description: The ledger name.
          in: path
          name: ledger
          required: true
          schema:
            $ref: "#/components/schemas/LedgerName"
        - description: Only transactions with a posting from or to an account at or below this prefix.
          in: query
          name: address
          schema:
            $ref: "#/components/schemas/AddressPrefix"
        - in: query
          name: asset
          schema:
            $ref: "#/components/schemas/Asset"
        - in: query
          name: reference
          schema:
            maxLength: 255
            type: string
        - in: query
          name: eventType
          schema:
            maxLength: 63
            type: string
        - description: Committed at or after this time.
          in: query
          name: after
          schema:
            format: date-time
            type: string
        - description: Committed before this time.
          in: query
          name: before
          schema:
            format: date-time
            type: string
        - description: Page size.
          in: query
          name: limit
          schema:
            default: 25
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionList"
          description: A page of transactions.
          headers:
            X-Request-Id:
              description: "The request ID: the one the client sent when it was valid, a new one otherwise."
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
      security:
        - bearerAuth: []
      summary: List transactions
      tags:
        - transactions
    post:
      description: |
        Applies the postings as one linked chain of TigerBeetle transfers: all of them or none.
        Accounts are created by their first posting with the flags of the matching account rule
        (ADR-0006). A decline, such as `exceeds_credits`, answers 422 with the result of every
        posting in `results`; nothing was applied.
      operationId: createTransaction
      parameters:
        - description: |
            Identifies the write. Reusing it with the same body replays the stored outcome; with a
            different body answers 422 `idempotency-key-reused`.
          in: header
          name: Idempotency-Key
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
        - description: The alias of the organization the call acts for. A person sends it on every call about a ledger and must be a member of the organization; an organization that is not one of theirs answers 404. API keys and machine clients belong to one organization and need not send it.
          in: header
          name: X-Organization
          schema:
            maxLength: 63
            type: string
        - description: Correlates the request with the service logs. Kept when it is 1 to 128 printable ASCII characters without spaces, replaced by a new ID otherwise, and returned in the X-Request-Id response header.
          in: header
          name: X-Request-Id
          schema:
            maxLength: 128
            type: string
        - description: The ledger name.
          in: path
          name: ledger
          required: true
          schema:
            $ref: "#/components/schemas/LedgerName"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
          description: The transaction was committed.
          headers:
            X-Request-Id:
              description: "The request ID: the one the client sent when it was valid, a new one otherwise."
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
      security:
        - bearerAuth: []
      summary: Create a transaction
      tags:
        - transactions
