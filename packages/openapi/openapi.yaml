      properties:
        dependencies:
          $ref: "#/components/schemas/Dependencies"
      required:
        - dependencies
      type: object
    Operation:
      enum:
        - transaction
        - revert
        - hold
        - capture
        - void
      type: string
    Organization:
      properties:
        alias:
          description: "Unique and permanent: the value of X-Organization and the organization's URL segment."
          type: string
        createdAt:
          format: date-time
          type: string
        createdBy:
          description: The staff member who created it; absent for a seeded organization.
          type: string
        id:
          description: The platform's ID of the organization.
          type: string
        keycloakId:
          description: Keycloak's ID of the organization.
          type: string
        ledgers:
          description: The number of ledgers.
          type: integer
        members:
          description: The number of members in Keycloak.
          type: integer
        name:
          type: string
        owners:
          description: The owners, oldest first, and the first owner while on the way in.
          items:
            $ref: "#/components/schemas/Owner"
          type: array
        status:
          description: A suspended organization answers 403 organization-suspended to every call made in its name.
          enum:
            - active
            - suspended
          type: string
        suspensionReason:
          description: Why staff suspended it, shown to its members.
          type: string
      required:
        - id
        - alias
        - name
        - status
        - createdAt
        - owners
        - members
        - ledgers
      type: object
    OrganizationList:
      properties:
        data:
          items:
            $ref: "#/components/schemas/Organization"
          type: array
        next:
          description: The cursor of the next page; absent on the last one.
          type: string
      required:
        - data
      type: object
    OrganizationRoleRequest:
      properties:
        role:
          description: Only an owner can grant or take away owner; the last owner stays.
          enum:
            - member
            - admin
            - owner
          type: string
      required:
        - role
      type: object
    Owner:
      properties:
        email:
          type: string
        name:
          type: string
        since:
          description: When the owner role was granted.
          format: date-time
          type: string
        status:
          enum:
            - active
            - setup-pending
            - invited
          type: string
        subject:
          type: string
      required:
        - subject
        - email
        - name
        - status
        - since
      type: object
    Posting:
      properties:
        amount:
          $ref: "#/components/schemas/Amount"
        asset:
          $ref: "#/components/schemas/Asset"
        destination:
          $ref: "#/components/schemas/Address"
          description: The credited account.
        source:
          $ref: "#/components/schemas/Address"
          description: The debited account.
      required:
        - source
        - destination
        - asset
        - amount
      type: object
    PostingRecord:
      allOf:
        - $ref: "#/components/schemas/Posting"
        - properties:
            tbLedger:
              format: int64
              type: integer
            transferId:
              $ref: "#/components/schemas/Id"
          required:
            - transferId
            - tbLedger
          type: object
    Problem:
      description: RFC 9457 problem details.
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence.
          type: string
        errors:
          description: Each parameter or body member that could not be decoded, for an `invalid-request` problem.
          items:
            properties:
              detail:
                description: What is wrong with the value.
                type: string
              in:
                description: Where the parameter is.
                enum:
                  - path
                  - query
                  - header
                  - cookie
                type: string
              parameter:
                description: The name of the parameter at fault.
                type: string
              pointer:
                description: A JSON Pointer in URI fragment form to the body member at fault, such as `#/postings/0/amount`; `#` is the whole body.
                format: uri-reference
                type: string
            required:
              - detail
            type: object
          type: array
        instance:
          description: The path of the request that failed, a URI reference relative to the API.
          format: uri-reference
          type: string
        posting:
          description: The zero-based index of the posting that caused the problem.
          type: integer
        requestId:
          description: The request ID, also returned in the X-Request-Id header.
          type: string
        results:
          description: |
            The TigerBeetle result of every posting of a declined chain, in order, such as
            `["linked_event_failed", "exceeds_credits"]`. Nothing was applied.
          items:
            type: string
          type: array
        status:
          description: The HTTP status code.
          maximum: 599
          minimum: 100
          type: integer
        targetId:
          $ref: "#/components/schemas/Id"
          description: The transaction or hold ID minted for a declined write.
        title:
          description: A short summary of the problem type, the same for every occurrence. For `about:blank` it is the HTTP status phrase.
          type: string
        type:
          default: about:blank
          description: |
            An absolute URI that identifies the problem type: `about:blank`, or the entry of
            the problem in the catalogue, the same in every deployment, which clients switch on:
            `https://github.com/wilfriedago/tigerbeetle-platform/blob/develop/docs/problems.md#<reason>`.
          examples:
            - https://github.com/wilfriedago/tigerbeetle-platform/blob/develop/docs/problems.md#exceeds-credits
          format: uri-reference
          type: string
      required:
        - type
        - title
        - status
      type: object
    PutRuleRequest:
      properties:
        code:
          maximum: 65535
          minimum: 1
          type: integer
        history:
          default: false
          type: boolean
        limit:
          $ref: "#/components/schemas/BalanceLimit"
      required:
        - limit
        - code
      type: object
    Readiness:
      properties:
        dependencies:
          $ref: "#/components/schemas/Dependencies"
        status:
          enum:
            - ready
            - not_ready
            - degraded
          type: string
      required:
        - status
        - dependencies
      type: object
    ReconcilerStatus:
      properties:
        gracePeriodSeconds:
          description: A pending record younger than this is a write in progress, not a crash.
          type: integer
        intervalSeconds:
          type: integer
        lastRunAt:
          format: date-time
          type: string
        lastSettled:
          description: Records settled by the last run.
          type: integer
        pending:
          description: Pending records, across all ledgers.
          format: int64
          type: integer
        running:
          type: boolean
        stuck:
          description: Pending records older than the grace period that the reconciler could not settle.
          format: int64
          type: integer
        stuckRequests:
          items:
            $ref: "#/components/schemas/StuckRequest"
          type: array
      required:
        - running
        - gracePeriodSeconds
        - intervalSeconds
        - pending
        - stuck
      type: object
    RequestStatus:
      enum:
        - pending
        - committed
        - declined
        - failed
      type: string
    RevertTransactionRequest:
      properties:
        metadata:
          $ref: "#/components/schemas/Metadata"
        reference:
          maxLength: 255
          type: string
      type: object
    Rule:
      properties:
        builtIn:
          description: A default that applies without being stored.
          type: boolean
        code:
          maximum: 65535
          minimum: 1
          type: integer
        createdAt:
          format: date-time
          type: string
        history:
          type: boolean
        limit:
          $ref: "#/components/schemas/BalanceLimit"
        pattern:
          examples:
            - "users:"
            - world
            - "*"
          type: string
        segments:
          description: Specificity; the most specific matching rule wins.
          type: integer
        updatedAt:
          format: date-time
          type: string
      required:
        - pattern
        - limit
        - history
        - code
        - builtIn
        - segments
      type: object
    RuleCandidate:
      properties:
        matches:
          type: boolean
        rule:
          $ref: "#/components/schemas/Rule"
      required:
        - rule
        - matches
      type: object
    RuleList:
      properties:
        data:
          items:
            $ref: "#/components/schemas/Rule"
          type: array
      required:
        - data
      type: object
    RuleMatch:
      properties:
        address:
          $ref: "#/components/schemas/Address"
        candidates:
          items:
            $ref: "#/components/schemas/RuleCandidate"
          type: array
        existing:
          description: Assets this address already has accounts in; those keep their frozen flags.
          items:
            $ref: "#/components/schemas/Asset"
          type: array
        rule:
          $ref: "#/components/schemas/Rule"
      required:
        - address
        - rule
        - candidates
        - existing
      type: object
    Runtime:
      description: Versions and settings of the running service.
      properties:
        goVersion:
          examples:
            - go1.27.3
          type: string
        postgresVersion:
          description: The server version reported by Postgres, when reachable.
          type: string
        schemaVersion:
          description: The last applied migration, when reachable.
          format: int64
          type: integer
        startedAt:
          format: date-time
          type: string
        tigerbeetleClientVersion:
          examples:
            - v0.17.10
          type: string
        tigerbeetleClusterId:
          description: The cluster ID, a u128 in decimal.
          type: string
      required:
        - startedAt
        - goVersion
        - tigerbeetleClientVersion
        - tigerbeetleClusterId
      type: object
    SearchResults:
      properties:
        accounts:
          items:
            properties:
              address:
                $ref: "#/components/schemas/Address"
              assets:
                items:
                  $ref: "#/components/schemas/Asset"
                type: array
            required:
              - address
              - assets
            type: object
          type: array
        holds:
          items:
            properties:
              id:
                $ref: "#/components/schemas/Id"
              status:
                $ref: "#/components/schemas/HoldStatus"
            required:
              - id
              - status
            type: object
          type: array
        query:
          type: string
        requests:
          items:
            properties:
              key:
                type: string
              operation:
                $ref: "#/components/schemas/Operation"
              status:
                $ref: "#/components/schemas/RequestStatus"
            required:
              - key
              - operation
              - status
            type: object
          type: array
        transactions:
          items:
            properties:
              committedAt:
                format: date-time
                type: string
              id:
                $ref: "#/components/schemas/Id"
              reference:
                type: string
            required:
              - id
              - committedAt
            type: object
          type: array
      required:
        - query
        - accounts
        - transactions
        - holds
        - requests
      type: object
    Segment:
      properties:
        accounts:
          description: Addresses at or below the segment.
          format: int64
          type: integer
        assets:
          items:
            $ref: "#/components/schemas/Asset"
          type: array
        hasChildren:
          type: boolean
        isAccount:
          description: The prefix is itself an address.
          type: boolean
        prefix:
          description: The full path of the segment.
          examples:
            - users:1234
          type: string
        segment:
          examples:
            - "1234"
          type: string
      required:
        - segment
        - prefix
        - accounts
        - assets
        - isAccount
        - hasChildren
      type: object
    SegmentList:
      properties:
        data:
          items:
            $ref: "#/components/schemas/Segment"
          type: array
        prefix:
          type: string
      required:
        - data
      type: object
    SignedAmount:
      description: A signed integer in the asset's smallest unit, for balances.
      examples:
        - "-481230000"
      pattern: ^-?(0|[1-9][0-9]{0,39})$
      type: string
    StuckRequest:
      properties:
        attempts:
          type: integer
        createdAt:
          format: date-time
          type: string
        key:
          type: string
        ledger:
          $ref: "#/components/schemas/LedgerName"
        note:
          type: string
        operation:
          $ref: "#/components/schemas/Operation"
      required:
        - ledger
        - key
        - operation
        - createdAt
        - attempts
      type: object
    TigerBeetleTimestamp:
      description: The TigerBeetle timestamp, nanoseconds since the Unix epoch, as a decimal string.
      pattern: ^[0-9]+$
      type: string
    Transaction:
      properties:
        businessTime:
          description: The client's business time, stored in `user_data_64`. Not the committed time.
          format: date-time
          type: string
        committedAt:
          description: The TigerBeetle timestamp of the chain, the only time the ledger knows.
          format: date-time
          type: string
        eventType:
          $ref: "#/components/schemas/EventTypeRef"
        id:
          $ref: "#/components/schemas/Id"
        idempotencyKey:
          type: string
        ledger:
          $ref: "#/components/schemas/LedgerName"
        metadata:
          $ref: "#/components/schemas/Metadata"
        postings:
          items:
            $ref: "#/components/schemas/PostingRecord"
          type: array
        reference:
          type: string
        requestId:
          type: string
        revertedBy:
          $ref: "#/components/schemas/Id"
          description: The transaction that reverted this one.
        reverts:
          $ref: "#/components/schemas/Id"
          description: The transaction this one reverts.
        timestamp:
          $ref: "#/components/schemas/TigerBeetleTimestamp"
      required:
        - id
        - ledger
        - postings
        - eventType
        - metadata
        - committedAt
        - timestamp
        - idempotencyKey
      type: object
    TransactionList:
      properties:
        data:
          items:
            $ref: "#/components/schemas/Transaction"
          type: array
        next:
          type: string
      required:
        - data
      type: object
    UpdateOrganizationRequest:
      properties:
        name:
          maxLength: 100
          minLength: 1
          type: string
        reason:
          description: Why the organization is suspended, shown to its members. Used with status suspended.
          maxLength: 500
          type: string
        status:
          enum:
            - active
            - suspended
          type: string
      type: object
    WriteRequest:
      properties:
        attempts:
          description: TigerBeetle submissions, including reconciler retries.
          type: integer
        bodyHash:
          description: SHA-256 of the canonical request body, hex.
          type: string
        createdAt:
          format: date-time
          type: string
        key:
          type: string
        operation:
          $ref: "#/components/schemas/Operation"
        problemType:
          description: The problem type of a declined or failed write.
          type: string
        requestId:
          type: string
        resolvedAt:
          format: date-time
          type: string
        responseStatus:
          type: integer
        status:
          $ref: "#/components/schemas/RequestStatus"
        targetId:
          $ref: "#/components/schemas/Id"
          description: The transaction or hold minted for this write.
      required:
        - key
        - operation
        - status
        - createdAt
        - targetId
        - bodyHash
        - attempts
      type: object
    WriteRequestDetail:
      allOf:
        - $ref: "#/components/schemas/WriteRequest"
        - properties:
            request:
              additionalProperties: true
              description: The canonical request body as stored.
              type: object
            response:
              additionalProperties: true
              description: The stored response or problem body.
              type: object
            transferIds:
              description: The transfer IDs minted before the first submission, in chain order.
              items:
                $ref: "#/components/schemas/Id"
              type: array
          required:
            - request
            - transferIds
          type: object
    WriteRequestList:
      properties:
        data:
          items:
            $ref: "#/components/schemas/WriteRequest"
          type: array
        next:
          type: string
      required:
        - data
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: An access token from the platform's identity provider (ADR-0026).
      scheme: bearer
      type: http
info:
  description: |
    The contract for the TigerBeetle Platform API. This file is generated from the Go code by
    `cmd/openapi` (ADR-0018); do not edit it. The TypeScript client is generated from it.

    TigerBeetle is the only source of truth for money: every balance, amount and committed time in
    a response is read from the cluster. Postgres holds names and context only (ADR-0002).

    Amounts are strings holding an integer in the asset's smallest unit (`"1250"` with `EUR/2` is
    12.50). Balances may be negative and use the signed form. IDs are 32 lowercase hexadecimal
    characters, time ordered (ADR-0004).

    Writes that move money (transactions, reverts, holds, captures, voids) require an
    `Idempotency-Key` header. A key maps to exactly one outcome: retrying with the same key and
    body replays the stored answer, a key reused with a different body answers 422, and a key still
    in flight answers 409 with `Retry-After`. A declined write stays declined under its key; retry
    with a new key (ADR-0007).

    Errors use RFC 9457 problem details with the `application/problem+json` media type. The
    `type` is a stable absolute URI, the same in every deployment, that opens the problem's entry in
    the catalogue (`docs/problems.md`): for example
    `https://github.com/wilfriedago/tigerbeetle-platform/blob/develop/docs/problems.md#exceeds-credits`.
    A problem the HTTP status describes on its own has the type `about:blank`.

    Every operation except the health probes needs an access token, `Authorization: Bearer <token>`
    (ADR-0026), and answers 401 without a valid one. A person names the organization a call acts
    for with `X-Organization`; ledger names are unique within an organization (ADR-0027). A caller
    without a role on a ledger gets 404, one whose role lacks the permission 403 (ADR-0028). Request
    bodies must be sent as `application/json`; anything else answers 415 (ADR-0032).
  license:
    identifier: Apache-2.0
    name: Apache-2.0
  summary: A ledger API that makes TigerBeetle easier to work with.
  title: TigerBeetle Platform API
  version: 0.2.0
openapi: 3.1.0
paths:
  /healthz:
    get:
      description: Returns 200 as soon as the process serves HTTP. It does not check dependencies.
      operationId: getLiveness
      parameters:
        - description: Correlates the request with the service logs. Kept when it is 1 to 128 printable ASCII characters without spaces, replaced by a new ID otherwise, and returned in the X-Request-Id response header.
          in: header
          name: X-Request-Id
          schema:
            maxLength: 128
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
          description: The process is alive.
          headers:
            X-Request-Id:
              description: "The request ID: the one the client sent when it was valid, a new one otherwise."
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
      summary: Liveness probe
      tags:
        - operations
  /readyz:
    get:
      description: |
        Checks Postgres and TigerBeetle with a short timeout and reports each one. Returns a
        503 `not-ready` problem when any required dependency is down, so load balancers stop routing
        traffic to this instance.
      operationId: getReadiness
      parameters:
        - description: Correlates the request with the service logs. Kept when it is 1 to 128 printable ASCII characters without spaces, replaced by a new ID otherwise, and returned in the X-Request-Id response header.
          in: header
          name: X-Request-Id
          schema:
            maxLength: 128
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
          description: Every required dependency is reachable.
          headers:
            X-Request-Id:
              description: "The request ID: the one the client sent when it was valid, a new one otherwise."
              schema:
                type: string
        "503":
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problem"
                  - $ref: "#/components/schemas/NotReady"
          description: "A required dependency is unreachable: a `not-ready` problem whose `dependencies` reports each one."
          headers:
            X-Request-Id:
              description: "The request ID: the one the client sent when it was valid, a new one otherwise."
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
      summary: Readiness probe
      tags:
        - operations
  /v1/_info:
    get:
      description: Service name and version, runtime versions, and the reachability of Postgres and TigerBeetle.
      operationId: getInfo
      parameters:
        - description: The alias of the organization the call acts for. A person sends it on every call about a ledger and must be a member of the organization; an organization that is not one of theirs answers 404. API keys and machine clients belong to one organization and need not send it.
          in: header
          name: X-Organization
          schema:
            maxLength: 63
            type: string
        - description: Correlates the request with the service logs. Kept when it is 1 to 128 printable ASCII characters without spaces, replaced by a new ID otherwise, and returned in the X-Request-Id response header.
          in: header
          name: X-Request-Id
          schema:
            maxLength: 128
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"
          description: Service information.
          headers:
            X-Request-Id:
              description: "The request ID: the one the client sent when it was valid, a new one otherwise."
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
      security:
        - bearerAuth: []
      summary: Service information
      tags:
        - operations
  /v1/_reconciler:
    get:
      description: |
        The background loop that settles write records left pending by a crash between Postgres
        and TigerBeetle (ADR-0007): its last run and the records it is waiting on.
      operationId: getReconcilerStatus
      parameters:
        - description: The alias of the organization the call acts for. A person sends it on every call about a ledger and must be a member of the organization; an organization that is not one of theirs answers 404. API keys and machine clients belong to one organization and need not send it.
          in: header
          name: X-Organization
          schema:
            maxLength: 63
            type: string
        - description: Correlates the request with the service logs. Kept when it is 1 to 128 printable ASCII characters without spaces, replaced by a new ID otherwise, and returned in the X-Request-Id response header.
          in: header
          name: X-Request-Id
          schema:
            maxLength: 128
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconcilerStatus"
          description: Reconciler status.
          headers:
            X-Request-Id:
              description: "The request ID: the one the client sent when it was valid, a new one otherwise."
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
      security:
        - bearerAuth: []
      summary: Reconciler status
      tags:
        - operations
  /v1/api-keys:
    get:
      description: The organization's API keys, active ones first, without their secrets. Needs `org.credentials`.
      operationId: listAPIKeys
      parameters:
        - description: The alias of the organization the call acts for. A person sends it on every call about a ledger and must be a member of the organization; an organization that is not one of theirs answers 404. API keys and machine clients belong to one organization and need not send it.
          in: header
          name: X-Organization
          schema:
            maxLength: 63
            type: string
        - description: Correlates the request with the service logs. Kept when it is 1 to 128 printable ASCII characters without spaces, replaced by a new ID otherwise, and returned in the X-Request-Id response header.
          in: header
          name: X-Request-Id
          schema:
            maxLength: 128
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyList"
          description: The keys.
          headers:
            X-Request-Id:
              description: "The request ID: the one the client sent when it was valid, a new one otherwise."
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
      security:
        - bearerAuth: []
      summary: List API keys
      tags:
        - api-keys
    post:
      description: |
        Creates a key with the ledger roles it acts with and answers its secret, shown once: the
        platform keeps only a keyed hash of it. Send it as `Authorization: Bearer tbp_<id>_<secret>` on
        every transport. Needs `org.credentials`.
      operationId: createAPIKey
      parameters:
        - description: The alias of the organization the call acts for. A person sends it on every call about a ledger and must be a member of the organization; an organization that is not one of theirs answers 404. API keys and machine clients belong to one organization and need not send it.
          in: header
          name: X-Organization
          schema:
            maxLength: 63
            type: string
        - description: Correlates the request with the service logs. Kept when it is 1 to 128 printable ASCII characters without spaces, replaced by a new ID otherwise, and returned in the X-Request-Id response header.
          in: header
          name: X-Request-Id
          schema:
            maxLength: 128
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKeyRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAPIKey"
          description: The key and its secret.
          headers:
            X-Request-Id:
              description: "The request ID: the one the client sent when it was valid, a new one otherwise."
              schema:
                type: string
        default:
