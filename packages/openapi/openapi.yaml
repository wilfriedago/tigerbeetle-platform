    post:
      description: |
        Brings a person into the organization with an organization role. A person with an account
        gets an invitation by email and becomes a member by following it; a person without one gets
        an account and an email to verify the address and set a password. Inviting someone already
        setting up their account sends that email again; a member who holds a role answers 409.
        Needs `org.members`.
      operationId: inviteMember
      parameters:
        - description: The alias of the organization the call acts for. A person sends it on every call about a ledger and must be a member of the organization; an organization that is not one of theirs answers 404. API keys and machine clients belong to one organization and need not send it.
          in: header
          name: X-Organization
          schema:
            maxLength: 63
            type: string
        - description: Correlates the request with the service logs. Kept when it is 1 to 128 printable ASCII characters without spaces, replaced by a new ID otherwise, and returned in the X-Request-Id response header.
          in: header
          name: X-Request-Id
          schema:
            maxLength: 128
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
          description: The person was invited.
          headers:
            X-Request-Id:
              description: "The request ID: the one the client sent when it was valid, a new one otherwise."
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
      security:
        - bearerAuth: []
      summary: Invite a member
      tags:
        - members
  /v1/members/{subject}:
    delete:
      description: |
        Ends the membership and removes every role the person holds in the organization. Their
        account and other organizations stay. Needs `org.members`, except to leave: anyone may remove
        themselves. Removing an owner needs an owner, and the last owner stays.
      operationId: removeMember
      parameters:
        - description: The alias of the organization the call acts for. A person sends it on every call about a ledger and must be a member of the organization; an organization that is not one of theirs answers 404. API keys and machine clients belong to one organization and need not send it.
          in: header
          name: X-Organization
          schema:
            maxLength: 63
            type: string
        - description: Correlates the request with the service logs. Kept when it is 1 to 128 printable ASCII characters without spaces, replaced by a new ID otherwise, and returned in the X-Request-Id response header.
          in: header
          name: X-Request-Id
          schema:
            maxLength: 128
            type: string
        - description: The identity provider's ID of the person.
          in: path
          name: subject
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The member was removed.
          headers:
            X-Request-Id:
              description: "The request ID: the one the client sent when it was valid, a new one otherwise."
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
      security:
        - bearerAuth: []
      summary: Remove a member
      tags:
        - members
  /v1/members/{subject}/role:
    put:
      description: Replaces the person's organization role. Needs `org.members`; owner changes need an owner.
      operationId: setMemberRole
      parameters:
        - description: The alias of the organization the call acts for. A person sends it on every call about a ledger and must be a member of the organization; an organization that is not one of theirs answers 404. API keys and machine clients belong to one organization and need not send it.
          in: header
          name: X-Organization
          schema:
            maxLength: 63
            type: string
        - description: Correlates the request with the service logs. Kept when it is 1 to 128 printable ASCII characters without spaces, replaced by a new ID otherwise, and returned in the X-Request-Id response header.
          in: header
          name: X-Request-Id
          schema:
            maxLength: 128
            type: string
        - description: The identity provider's ID of the person.
          in: path
          name: subject
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationRoleRequest"
        required: true
      responses:
        "204":
          description: The role was set.
          headers:
            X-Request-Id:
              description: "The request ID: the one the client sent when it was valid, a new one otherwise."
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
      security:
        - bearerAuth: []
      summary: Set a member's organization role
      tags:
        - members
  /v1/organizations:
    get:
      description: Every organization of the platform, in alias order. Staff only.
      operationId: listOrganizations
      parameters:
        - description: The opaque `next` cursor of the previous page.
          in: query
          name: cursor
          schema:
            maxLength: 512
            type: string
        - description: Correlates the request with the service logs. Kept when it is 1 to 128 printable ASCII characters without spaces, replaced by a new ID otherwise, and returned in the X-Request-Id response header.
          in: header
          name: X-Request-Id
          schema:
            maxLength: 128
            type: string
        - description: Page size.
          in: query
          name: limit
          schema:
            default: 25
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationList"
          description: A page of organizations.
          headers:
            X-Request-Id:
              description: "The request ID: the one the client sent when it was valid, a new one otherwise."
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
      security:
        - bearerAuth: []
      summary: List organizations
      tags:
        - organizations
    post:
      description: |
        Creates the organization in the identity provider and the platform, and invites its first
        owner. Retrying with the same alias finishes an interrupted creation; an organization that
        already has an owner answers 409. Staff only.
      operationId: createOrganization
      parameters:
        - description: Correlates the request with the service logs. Kept when it is 1 to 128 printable ASCII characters without spaces, replaced by a new ID otherwise, and returned in the X-Request-Id response header.
          in: header
          name: X-Request-Id
          schema:
            maxLength: 128
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
          description: The organization was created and its owner invited.
          headers:
            X-Request-Id:
              description: "The request ID: the one the client sent when it was valid, a new one otherwise."
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
      security:
        - bearerAuth: []
      summary: Create an organization
      tags:
        - organizations
  /v1/organizations/{organization}:
    get:
      description: One organization. Staff only.
      operationId: getOrganization
      parameters:
        - description: Correlates the request with the service logs. Kept when it is 1 to 128 printable ASCII characters without spaces, replaced by a new ID otherwise, and returned in the X-Request-Id response header.
          in: header
          name: X-Request-Id
          schema:
            maxLength: 128
            type: string
        - description: The organization's alias.
          in: path
          name: organization
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
          description: The organization.
          headers:
            X-Request-Id:
              description: "The request ID: the one the client sent when it was valid, a new one otherwise."
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
      security:
        - bearerAuth: []
      summary: Get an organization
      tags:
        - organizations
    patch:
      description: |
        Changes the fields the body names. A suspended organization answers 403
        `organization-suspended` to every call made in its name; its members can still sign in.
        Staff only.
      operationId: updateOrganization
      parameters:
        - description: Correlates the request with the service logs. Kept when it is 1 to 128 printable ASCII characters without spaces, replaced by a new ID otherwise, and returned in the X-Request-Id response header.
          in: header
          name: X-Request-Id
          schema:
            maxLength: 128
            type: string
        - description: The organization's alias.
          in: path
          name: organization
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
          description: The organization.
          headers:
            X-Request-Id:
              description: "The request ID: the one the client sent when it was valid, a new one otherwise."
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
      security:
        - bearerAuth: []
      summary: Rename, suspend or reactivate an organization
      tags:
        - organizations
security: []
servers:
  - description: Local compose stack
    url: http://localhost:8080
tags:
  - description: Liveness, readiness, service information and the reconciler.
    name: operations
  - description: Ledgers are namespaces. Money never crosses ledgers.
    name: ledgers
  - description: Accounts are addresses such as `users:1234:wallet`, created by their first posting.
    name: accounts
  - description: A transaction is one linked chain of TigerBeetle transfers; all postings apply or none.
    name: transactions
  - description: Holds are TigerBeetle two-phase transfers, captured, voided or expired exactly once.
    name: holds
  - description: Account rules and event types of a ledger.
    name: settings
