          schema:
            maxLength: 128
            type: string
        - description: The ledger name.
          in: path
          name: ledger
          required: true
          schema:
            $ref: "#/components/schemas/LedgerName"
        - description: Only addresses equal to or below this prefix, on whole segments. A trailing colon is optional.
          in: query
          name: prefix
          schema:
            $ref: "#/components/schemas/AddressPrefix"
        - description: Only addresses starting with this text, for autocompletion.
          in: query
          name: search
          schema:
            maxLength: 255
            type: string
        - description: Only accounts holding this asset.
          in: query
          name: asset
          schema:
            $ref: "#/components/schemas/Asset"
        - description: Page size.
          in: query
          name: limit
          schema:
            default: 25
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
