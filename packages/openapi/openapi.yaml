  /v1/ledgers/{ledger}/accounts:
    get:
      description: |
        Accounts in address order with their balance per asset, read from TigerBeetle in one batch
        for the page. `prefix` matches whole segments (`users:1` does not match `users:12:wallet`);
        `search` matches the start of the address as typed, for pickers. Lists cannot be sorted or
        filtered by balance: Postgres holds no balances (ADR-0002).
      operationId: listAccounts
      parameters:
        - description: The opaque `next` cursor of the previous page.
          in: query
          name: cursor
          schema:
            maxLength: 512
            type: string
        - description: The alias of the organization the call acts for. A person sends it on every call about a ledger and must be a member of the organization; an organization that is not one of theirs answers 404. API keys and machine clients belong to one organization and need not send it.
          in: header
