# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/v2.8.1/configuration-schema.json
# Run with: go tool oapi-codegen -config oapi-codegen.yaml ../../packages/openapi/openapi.yaml
package: gen
output: internal/adapters/httpapi/gen/api.gen.go
generate:
  # Routes registered on net/http's ServeMux with Go 1.22+ method patterns ("GET /v1/_info").
  std-http-server: true
  # Strict handlers receive typed request objects and return typed response objects, so handler
  # code never touches http.ResponseWriter directly.
  strict-server: true
  models: true
output-options:
  skip-prune: false
