# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
version: '2'

run:
  timeout: 5m
  build-tags:
    - integration
    - e2e

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - sqlclosecheck
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    depguard:
      # The module boundaries of docs/plans/ddd-transports/plan.md, section 14. File globs are
      # matched against absolute paths, hence the leading **/; pkg entries are import-path
      # prefixes. Every rule is proven to fire by the fixtures in testdata/depguard, which
      # `just lint-depguard-probe` lints one by one: a rule renamed, a glob mistyped or a module
      # added without its lines makes the probe fail. YAML anchors (&name, *name) repeat the
      # common deny entries.
      rules:
        kernel:
          list-mode: lax
          files: ['**/internal/kernel/**']
          deny:
            - pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal
              desc: the shared kernel imports nothing from internal
            - &io-pgx { pkg: github.com/jackc/pgx, desc: no I/O here }
            - &io-tb { pkg: github.com/tigerbeetle/tigerbeetle-go, desc: no I/O here }
            - &io-http { pkg: net/http, desc: no transport here }
            - &fw-huma { pkg: github.com/danielgtaylor/huma, desc: no framework here }
            - &fw-gql { pkg: github.com/99designs/gqlgen, desc: no framework here }
            - &fw-grpc { pkg: google.golang.org/grpc, desc: no transport here }
            - &br-amqp { pkg: github.com/rabbitmq/amqp091-go, desc: no broker here }
            - &br-nats { pkg: github.com/nats-io/nats.go, desc: no broker here }
            - &br-kafka { pkg: github.com/twmb/franz-go, desc: no broker here }
        module-domain:
          list-mode: lax
          files: ['**/internal/modules/*/domain/**']
          deny:
            - { pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/modules, desc: domain depends on the kernel only }
            - { pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/platform, desc: domain depends on the kernel only }
            - { pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/transport, desc: domain depends on the kernel only }
            - { pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/bootstrap, desc: domain depends on the kernel only }
            - *io-pgx
            - *io-tb
            - *io-http
            - *fw-huma
            - *fw-gql
            - *fw-grpc
            - *br-amqp
            - *br-nats
            - *br-kafka
        module-application:
          list-mode: lax
          files: ['**/internal/modules/*/application/**']
          deny:
            - {
                pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/modules/ledgers/infrastructure,
                desc: application depends on its domain only
              }
            - {
                pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/modules/ledgers/interfaces,
                desc: application depends on its domain only
              }
            - {
                pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/modules/bookkeeping/infrastructure,
                desc: application depends on its domain only
              }
            - {
                pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/modules/bookkeeping/interfaces,
                desc: application depends on its domain only
              }
            - {
                pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/modules/access/infrastructure,
                desc: application depends on its domain only
              }
            - {
                pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/modules/access/interfaces,
                desc: application depends on its domain only
              }
            - { pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/modules/health, desc: health has no application layer to call }
            - { pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/platform, desc: use cases get platform services through ports }
            - { pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/transport, desc: use cases know no transport }
            - { pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/bootstrap, desc: use cases know no wiring }
            - *io-pgx
            - *io-tb
            - *io-http
            - *fw-huma
            - *fw-gql
            - *fw-grpc
            - *br-amqp
            - *br-nats
            - *br-kafka
        module-infrastructure:
          list-mode: lax
          files: ['**/internal/modules/*/infrastructure/**']
          deny:
            - {
                pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/modules/ledgers/application,
                desc: infrastructure implements domain ports only
              }
            - {
                pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/modules/ledgers/interfaces,
                desc: infrastructure implements domain ports only
              }
            - {
                pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/modules/bookkeeping/application,
                desc: infrastructure implements domain ports only
              }
            - {
                pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/modules/bookkeeping/interfaces,
                desc: infrastructure implements domain ports only
              }
            - {
                pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/modules/access/application,
                desc: infrastructure implements domain ports only
              }
            - {
                pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/modules/access/interfaces,
                desc: infrastructure implements domain ports only
              }
            - { pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/transport, desc: infrastructure knows no transport }
            - { pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/bootstrap, desc: infrastructure knows no wiring }
            - *io-http
            - *fw-huma
            - *fw-gql
            - *fw-grpc
        module-interfaces:
          list-mode: lax
          files: ['**/internal/modules/*/interfaces/**']
          deny:
            - {
                pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/modules/ledgers/infrastructure,
                desc: 'interfaces call use cases, never drivers'
              }
            - {
                pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/modules/bookkeeping/infrastructure,
                desc: 'interfaces call use cases, never drivers'
              }
            - {
                pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/modules/access/infrastructure,
                desc: 'interfaces call use cases, never drivers'
              }
            - { pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/transport, desc: 'transports compose modules, not the reverse' }
            - { pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/bootstrap, desc: no wiring in interfaces }
            - { pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/platform/postgres, desc: no driver in interfaces }
            - { pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/platform/tigerbeetle, desc: no driver in interfaces }
            - *io-pgx
            - *io-tb
        # One rule per module: no file of another module imports it. Bootstrap and the transports
        # are outside internal/modules, so they may compose modules.
        isolate-ledgers:
          list-mode: lax
          files: ['**/internal/modules/**', '!**/internal/modules/ledgers/**']
          deny:
            - {
                pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/modules/ledgers,
                desc: modules talk through ports wired in bootstrap
              }
        isolate-bookkeeping:
          list-mode: lax
          files: ['**/internal/modules/**', '!**/internal/modules/bookkeeping/**']
          deny:
            - {
                pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/modules/bookkeeping,
                desc: modules talk through ports wired in bootstrap
              }
        isolate-health:
          list-mode: lax
          files: ['**/internal/modules/**', '!**/internal/modules/health/**']
          deny:
            - {
                pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/modules/health,
                desc: modules talk through ports wired in bootstrap
              }
        isolate-access:
          list-mode: lax
          files: ['**/internal/modules/**', '!**/internal/modules/access/**']
          deny:
            - {
                pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/modules/access,
                desc: modules talk through ports wired in bootstrap
              }
        platform:
          list-mode: lax
          files: ['**/internal/platform/**']
          deny:
            - { pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/modules, desc: platform has no business rule }
            - { pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/transport, desc: platform has no business rule }
            - { pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/bootstrap, desc: platform has no business rule }
        # The GraphQL registrations compile without gqlgen or its generated executor, so
        # cmd/graphqlschema runs when the executor is stale (plan section 8.7).
        graphql-registrations:
          list-mode: lax
          files:
            - '**/internal/modules/*/interfaces/graphql/**'
            - '**/internal/transport/graphql/schema/**'
            - '**/internal/platform/graphqlschema/**'
            - '**/internal/platform/scalar/**'
            - '**/cmd/graphqlschema/**'
          deny:
            - { pkg: github.com/99designs/gqlgen, desc: registrations must compile when gqlgen output is stale }
            - {
                pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/transport/graphql/exec,
                desc: registrations must compile when gqlgen output is stale
              }
        # cmd/openapi and cmd/graphqlschema write the specs without starting anything (ADR-0018):
        # no driver, and no cgo, which just generate enforces by building them with CGO_ENABLED=0.
        spec-commands:
          list-mode: lax
          files: ['**/cmd/openapi/**', '**/cmd/graphqlschema/**']
          deny:
            - { pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/platform/tigerbeetle, desc: spec commands build without cgo }
            - { pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/platform/postgres, desc: spec commands open no connection }
            - {
                pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/modules/ledgers/infrastructure,
                desc: spec commands build without drivers
              }
            - {
                pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/modules/bookkeeping/infrastructure,
                desc: spec commands build without drivers
              }
            - {
                pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/modules/access/infrastructure,
                desc: spec commands build without drivers
              }
            - { pkg: github.com/wilfriedago/tigerbeetle-platform/apps/api/internal/bootstrap, desc: spec commands build without drivers }
            - *io-pgx
            - *io-tb
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
    exhaustive:
      default-signifies-exhaustive: true
    gosec:
      excludes:
        # G115: integer overflow conversions. Flagged case by case in review instead.
        - G115
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/wilfriedago/tigerbeetle-platform
  exclusions:
    generated: strict
